[package]
name = "symbios-genetics"
version = "0.2.2"
edition = "2024"
authors = ["Janus"]
description = "Sovereign biology engine for Quality-Diversity and Multi-Objective evolution."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-genetics"
keywords = [
    "simulation",
    "evolution",
    "quality-diversity",
    "genetic-algorithms",
]
categories = ["simulation", "algorithms"]

[dependencies]
# No OS entropy here: every algorithm is seeded. Default features would drag
# thread_rng -> os_rng -> getrandom's wasm backend onto every consumer.
rand = { version = "0.9", default-features = false, features = ["std", "small_rng"] }
rand_pcg = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rayon = { version = "1.10", optional = true }
bincode = { version = "1.3", optional = true }
seahash = { version = "4.1", optional = true }

[dev-dependencies]
# The examples draw from rand::rng(); dev-only, so consumers never see it.
rand = "0.9"
serde_json = "1.0"
bincode = "1.3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "algorithms"
harness = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
export = ["dep:bincode", "dep:seahash"]
